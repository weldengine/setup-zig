# Monorepo usage: build.zig.zon lives in a sub-directory.
# The version-file input points at it explicitly; a missing file is an error.

name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: weldengine/setup-zig@v1
        with:
          version-file: tools/zig/build.zig.zon
      - run: zig build test
        working-directory: tools/zig
